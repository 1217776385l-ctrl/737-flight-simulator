<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>E2E · 完整一局自动演示</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0e12; }
    canvas { display: block; }
    #e2e-log {
      position: fixed; left: 8px; bottom: 8px; width: 46%; max-height: 34%;
      overflow: auto; z-index: 60; font: 11px/1.55 ui-monospace, Menlo, monospace;
      color: #9fe09f; background: rgba(8,12,10,.82); border: 1px solid #2c3; border-radius: 6px;
      padding: 6px 10px; pointer-events: none; white-space: pre-wrap;
    }
    #e2e-log .warn { color: #ffb020; }
    #e2e-log .bad { color: #ff6b60; }
    #e2e-log .snap { color: #4af0ff; font-weight: 700; }
  </style>
  <script type="importmap">
    { "imports": { "three": "../lib/three.module.js" } }
  </script>
</head>
<body>
  <div id="e2e-log">E2E 日志…</div>
  <script type="module" src="../src/main.js"></script>
  <script type="module" src="./e2e-main.js"></script>
</body>
</html>
