<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>单元 3 · 外部世界 dev · 737-800 模拟器</title>
<style>
  body { margin: 0; overflow: hidden; background: #000; }
  #hud {
    position: fixed; left: 12px; top: 12px; z-index: 10;
    font: 12px/1.6 "SF Mono", Menlo, Consolas, monospace;
    color: #d8e2ec; text-shadow: 0 1px 2px #000;
    background: rgba(8,12,18,0.55); padding: 8px 12px; border-radius: 4px;
    max-width: 460px; pointer-events: none;
  }
  #hud .mode { color: #ffd479; font-size: 13px; letter-spacing: 1px; }
  #hud .desc { color: #aebccb; }
  #hud .live { color: #9fd8a2; }
  #err {
    position: fixed; left: 12px; bottom: 12px; z-index: 11; display: none;
    font: 12px/1.5 monospace; color: #ff8080; background: rgba(30,4,4,0.8);
    padding: 8px 12px; border-radius: 4px; max-width: 70vw; white-space: pre-wrap;
  }
  #flash { /* 雷暴闪电全屏闪屏（weather onLightning 回调驱动） */
    position: fixed; inset: 0; background: #e8f0ff; opacity: 0;
    pointer-events: none; z-index: 5;
  }
</style>
<script type="importmap">
  { "imports": { "three": "../lib/three.module.js" } }
</script>
</head>
<body>
<div id="hud">
  <div class="mode" id="hudMode"></div>
  <div class="desc" id="hudDesc"></div>
  <div class="live" id="hudLive"></div>
</div>
<div id="flash"></div>
<div id="err"></div>
<script type="module" src="./world-main.js"></script>
</body>
</html>
